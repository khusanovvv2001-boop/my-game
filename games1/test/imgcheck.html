<!DOCTYPE html>
<html lang="uz">
<head><meta charset="UTF-8"><title>CHECK</title></head>
<body>
<script>
  var files = ['menu.png', 'play.png', 'boss.png', 'win.png'];
  var out = [];
  var errs = [];

  function checkOne(name) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        try {
          var c = document.createElement('canvas');
          c.width = img.width; c.height = img.height;
          var x = c.getContext('2d');
          x.drawImage(img, 0, 0);
          var d = x.getImageData(0, 0, c.width, c.height).data;
          var colors = {}, lit = 0, n = 0;
          for (var p = 0; p < d.length; p += 4 * 131) {
            colors[(d[p] >> 3) + ',' + (d[p + 1] >> 3) + ',' + (d[p + 2] >> 3)] = 1;
            if (d[p] + d[p + 1] + d[p + 2] > 60) lit++;
            n++;
          }
          var distinct = Object.keys(colors).length;
          out.push(name + ':' + distinct + 'c/' + lit + 'lit');
          if (distinct < 8) errs.push(name + ' juda oddiy (' + distinct + ' rang)');
          if (lit < 50) errs.push(name + ' deyarli qora');
          resolve();
        } catch (e) { errs.push(name + ' ' + e.message); resolve(); }
      };
      img.onerror = function () { errs.push(name + ' yuklanmadi'); resolve(); };
      img.src = '../media/' + name;
    });
  }

  (function run(i) {
    if (i >= files.length) {
      document.title = errs.length ? ('ERROR ' + errs.join(' | ')) : ('OK ' + out.join(' '));
      return;
    }
    checkOne(files[i]).then(function () { run(i + 1); });
  })(0);
</script>
</body>
</html>
