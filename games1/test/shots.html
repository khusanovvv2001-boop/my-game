<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>shots</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #07070d; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap {
    position: relative;
    width: min(100vw, 1100px);
    aspect-ratio: 16 / 9;
    box-shadow: 0 0 0 2px #1d2050, 0 18px 60px rgba(0,0,0,.7);
    border-radius: 8px;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; background: #0a0a14; cursor: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<script src="../game.js"></script>
<script>
  /* ?scene=menu | play | boss | win — skrinshot uchun sahna tayyorlaydi */
  var scene = (location.search.match(/scene=([a-z]+)/) || [])[1] || 'play';
  var G = window.__game;
  var cv = document.getElementById('game');

  /* nishonni to'g'ridan-to'g'ri canvas kordinatasiga qo'yamiz */
  function aim(x, y) { G.mouse.x = x; G.mouse.y = y; }

  setTimeout(function () {
    try {
      if (scene === 'menu') {
        /* menyuda qolamiz */
        G.step(1);
        return;
      }
      G.start();
      if (scene === 'boss') { G.gen(4); }
      if (scene === 'win') { G.state = 'win'; }
      if (scene === 'mobile') {
        /* touch rejimni yoqamiz — ekran tugmalari chiqsin */
        cv.dispatchEvent(new TouchEvent('touchstart', {
          bubbles: true, cancelable: true,
          touches: [new Touch({ identifier: 1, target: cv, clientX: 40, clientY: 480 })],
        }));
      }

      for (var i = 0; i < 90; i++) G.step(1);

      if (scene === 'play') {
        /* o'yinchini sahnada joylashtiramiz va nishonlaymiz */
        G.player.x = 300;
        G.player.y = 300;
        G.player.vy = -3;
        G.mouse.x = 620;
        G.mouse.y = 330;
        for (var j = 0; j < 10; j++) G.step(1);
        /* hujum animatsiyasi — kadr ichida ko'rinsin */
        G.player.atk = 12;
        G.player.atkCd = 0;
        aim(620, 330);
        G.step(1);
      }
      if (scene === 'boss') {
        G.mouse.x = 520;
        G.mouse.y = 300;
        for (var k = 0; k < 6; k++) G.step(1);
        G.player.atk = 13;
        aim(520, 300);
        G.step(1);
      }
      if (scene === 'mobile') {
        /* chap tugma bosilgan holat + hujum animatsiyasi */
        G.player.x = 340; G.player.y = 430;
        for (var q = 0; q < 8; q++) G.step(1);
        G.player.atk = 13;
        G.mouse.x = 640; G.mouse.y = 440;
        G.step(1);
      }
      document.title = 'SHOT ' + scene + ' ok';
    } catch (e) {
      document.title = 'ERROR ' + (e && e.message ? e.message : String(e));
    }
  }, 250);
</script>
</body>
</html>
